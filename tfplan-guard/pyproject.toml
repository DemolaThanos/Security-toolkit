[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tfplan-guard"
dynamic = ["version"]
description = "Check AWS Terraform plan and state JSON for security misconfigurations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ademola (Hammed) Gbadamosi" }]
keywords = ["terraform", "aws", "iam", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
]

[project.scripts]
tfplan-guard = "tfplan_guard.cli:cli"

[project.urls]
Homepage = "https://github.com/DemolaThanos/Security-toolkit"
Repository = "https://github.com/DemolaThanos/Security-toolkit"
Issues = "https://github.com/DemolaThanos/Security-toolkit/issues"
Changelog = "https://github.com/DemolaThanos/Security-toolkit/blob/main/tfplan-guard/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "tfplan_guard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tfplan_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["tfplan_guard"]
warn_unused_ignores = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.bandit]
exclude_dirs = ["tests"]
