[build-system]
requires = ["setuptools==75.3.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stride-model"
version = "0.1.0"
description = "Generate a STRIDE threat review from a system model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ademola (Hammed) Gbadamosi" }]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["mypy==2.4.0", "pytest==9.1.1", "ruff==0.17.2"]

[project.scripts]
stride-model = "stride_model.cli:cli"

[project.urls]
Repository = "https://github.com/DemolaThanos/Security-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stride_model = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["stride_model"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
