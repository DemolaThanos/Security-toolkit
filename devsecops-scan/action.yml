name: DevSecOps scan
description: Secret, SAST, and dependency advisory scan with optional passive DAST.
inputs:
  path:
    description: Directory or file to scan, relative to the workspace.
    required: false
    default: "."
  fail-on:
    description: Minimum severity that fails the job.
    required: false
    default: high
  advisories:
    description: OSV JSON feed. Empty uses the starter file.
    required: false
    default: ""
  dast-url:
    description: Single URL for a passive header check.
    required: false
    default: ""
  dast-authorized:
    description: Must be true before dast-url is requested.
    required: false
    default: "false"
  s3-bucket:
    description: Optional bucket for the SARIF report.
    required: false
    default: ""
  s3-key:
    description: Optional object key.
    required: false
    default: ""
  s3-kms-key-id:
    description: Optional KMS key id. Empty uses SSE-S3.
    required: false
    default: ""
outputs:
  sarif:
    description: Path to the SARIF report.
    value: ${{ steps.scan.outputs.report }}
runs:
  using: composite
  steps:
    - name: Install devsecops-scan
      shell: bash
      working-directory: ${{ github.action_path }}
      run: python -m pip install '.[s3]'
    - name: Scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        ADVISORIES: ${{ inputs.advisories }}
        DAST_URL: ${{ inputs.dast-url }}
        DAST_AUTHORIZED: ${{ inputs.dast-authorized }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_KEY: ${{ inputs.s3-key }}
        S3_KMS_KEY_ID: ${{ inputs.s3-kms-key-id }}
      run: |
        set -euo pipefail
        report="${RUNNER_TEMP:-/tmp}/devsecops-scan.sarif"
        cmd=(devsecops-scan scan "$SCAN_PATH" --fail-on "$FAIL_ON" --format sarif --output "$report")
        if [[ -n "$ADVISORIES" ]]; then
          cmd+=(--advisories "$ADVISORIES")
        fi
        if [[ -n "$DAST_URL" ]]; then
          if [[ "$DAST_AUTHORIZED" != "true" ]]; then
            echo "dast-url requires dast-authorized: true" >&2
            exit 2
          fi
          cmd+=(--dast-url "$DAST_URL" --i-am-authorized)
        fi
        if [[ -n "$S3_BUCKET" ]]; then
          cmd+=(--s3-bucket "$S3_BUCKET")
        fi
        if [[ -n "$S3_KEY" ]]; then
          cmd+=(--s3-key "$S3_KEY")
        fi
        if [[ -n "$S3_KMS_KEY_ID" ]]; then
          cmd+=(--s3-kms-key-id "$S3_KMS_KEY_ID")
        fi
        "${cmd[@]}"
        echo "report=${report}" >> "$GITHUB_OUTPUT"
