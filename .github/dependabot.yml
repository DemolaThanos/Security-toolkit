version: 2
updates:
  # One grouped pull request for Actions. Versions in workflows are commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # uv updates pyproject pins and uv.lock together. A separate pip ecosystem
  # opened a second pull request for the same bump, so it is not configured.
  - package-ecosystem: uv
    directory: /devsecops-scan
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /k8s-harden
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /stride-model
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /authrecon
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /tfplan-guard
    schedule:
      interval: weekly
    groups:
      python:
