name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }} / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - devsecops-scan
          - k8s-harden
          - stride-model
          - authrecon
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - name: Install
        working-directory: ${{ matrix.project }}
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: python -m ruff check src tests && python -m ruff format --check src tests

      - name: Typecheck
        working-directory: ${{ matrix.project }}
        run: python -m mypy

      - name: Test
        working-directory: ${{ matrix.project }}
        run: python -m pytest
