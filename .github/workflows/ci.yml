name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }} / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - devsecops-scan
          - k8s-harden
          - stride-model
          - authrecon
          - tfplan-guard
          - subtake
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - name: Install
        working-directory: ${{ matrix.project }}
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: python -m ruff check src tests && python -m ruff format --check src tests

      - name: Typecheck
        working-directory: ${{ matrix.project }}
        run: python -m mypy

      - name: Test
        working-directory: ${{ matrix.project }}
        run: python -m pytest
