name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }} / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - devsecops-scan
          - k8s-harden
          - stride-model
          - authrecon
          - tfplan-guard
          - subtake
          - gha-audit
          - corsprobe
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.13.7/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83  /tmp/uv.tar.gz" | sha256sum -c
          tar -xzf /tmp/uv.tar.gz -C /tmp
          install /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv

      - name: Install
        working-directory: ${{ matrix.project }}
        run: uv sync --frozen --extra dev --python "$(python -c 'import sys; print(sys.executable)')"

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: uv run ruff check src tests && uv run ruff format --check src tests

      - name: Typecheck
        working-directory: ${{ matrix.project }}
        run: uv run mypy

      - name: Security lint
        working-directory: ${{ matrix.project }}
        run: uv run bandit -r src -c pyproject.toml -q

      - name: Test
        working-directory: ${{ matrix.project }}
        run: uv run pytest

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts=--all --redact --verbose --exit-code 1
