name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }} / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - devsecops-scan
          - k8s-harden
          - stride-model
          - authrecon
          - tfplan-guard
          - subtake
          - gha-audit
          - corsprobe
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/uv.lock

      - name: Install
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -e ".[dev]"

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: python -m ruff check src tests && python -m ruff format --check src tests

      - name: Typecheck
        working-directory: ${{ matrix.project }}
        run: python -m mypy

      - name: Security lint
        working-directory: ${{ matrix.project }}
        run: python -m bandit -r src -c pyproject.toml -q

      - name: Test
        working-directory: ${{ matrix.project }}
        run: python -m pytest

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts=--all --redact --verbose --exit-code 1
