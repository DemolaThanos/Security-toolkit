name: security-scan

on:
  workflow_call:
    inputs:
      path:
        description: Path inside the caller repository to scan.
        type: string
        required: false
        default: .
      fail-on:
        description: Minimum severity that fails the job.
        type: string
        required: false
        default: high
      python-version:
        type: string
        required: false
        default: "3.12"
      dast-url:
        description: Single authorized URL for the passive header check.
        type: string
        required: false
        default: ""
      dast-authorized:
        description: Set true only when dast-url is a host you are allowed to test.
        type: boolean
        required: false
        default: false
      s3-bucket:
        type: string
        required: false
        default: ""
      s3-key:
        type: string
        required: false
        default: ""
      s3-kms-key-id:
        type: string
        required: false
        default: ""
      aws-region:
        type: string
        required: false
        default: us-east-1
      toolkit-repository:
        type: string
        required: false
        default: DemolaThanos/Security-toolkit
      toolkit-ref:
        description: Commit or tag of this toolkit to install. Pin this.
        type: string
        required: false
        default: main
    secrets:
      aws-role-arn:
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: work
          persist-credentials: false

      - name: Checkout scanner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repository }}
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Configure AWS credentials
        if: ${{ inputs.s3-bucket != '' && secrets.aws-role-arn != '' }}
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Install scanner
        run: python -m pip install "./toolkit/devsecops-scan[s3]"

      - name: Scan
        env:
          SCAN_PATH: ${{ inputs.path }}
          FAIL_ON: ${{ inputs.fail-on }}
          DAST_URL: ${{ inputs.dast-url }}
          DAST_AUTHORIZED: ${{ inputs.dast-authorized }}
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_KEY: ${{ inputs.s3-key }}
          S3_KMS_KEY_ID: ${{ inputs.s3-kms-key-id }}
        run: |
          set -euo pipefail
          if [[ "$SCAN_PATH" = /* ]]; then
            target="$SCAN_PATH"
          else
            target="work/${SCAN_PATH#./}"
          fi
          cmd=(devsecops-scan scan "$target" --fail-on "$FAIL_ON" --format sarif --output work/devsecops-scan.sarif)
          if [[ -n "$DAST_URL" ]]; then
            if [[ "$DAST_AUTHORIZED" != "true" ]]; then
              echo "dast-url requires dast-authorized: true" >&2
              exit 2
            fi
            cmd+=(--dast-url "$DAST_URL" --i-am-authorized)
          fi
          if [[ -n "$S3_BUCKET" ]]; then
            cmd+=(--s3-bucket "$S3_BUCKET")
          fi
          if [[ -n "$S3_KEY" ]]; then
            cmd+=(--s3-key "$S3_KEY")
          fi
          if [[ -n "$S3_KMS_KEY_ID" ]]; then
            cmd+=(--s3-kms-key-id "$S3_KMS_KEY_ID")
          fi
          "${cmd[@]}"

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devsecops-scan-sarif
          path: work/devsecops-scan.sarif
          if-no-files-found: ignore
