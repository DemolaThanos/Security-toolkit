name: secrets
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
      - name: cloud
        uses: aws-actions/configure-aws-credentials@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  call:
    uses: example/workflows/.github/workflows/deploy.yml@11bd71901bbe5b1630ceea73d27597364c9af683
    secrets: inherit
    permissions:
      contents: read
