name: safe
description: Composite action used by the tests.
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      shell: bash
      with:
        persist-credentials: false
    - shell: bash
      env:
        TITLE: ${{ github.event.issue.title }}
      run: echo "$TITLE"
